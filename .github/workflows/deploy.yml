name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Requires these repo secrets to be set (Settings → Secrets and variables → Actions):
    #   DEPLOY_HOST      - the server's hostname/IP
    #   DEPLOY_USER      - SSH user with access to /opt/code and the docker group
    #   DEPLOY_SSH_KEY   - private key matching a public key in that user's authorized_keys
    #   DEPLOY_PATH      - absolute path to the checked-out repo on the server (e.g. /opt/code)
    # Until these are configured this job is a no-op that fails loudly rather than
    # silently doing nothing, so a misconfigured deploy doesn't look like a success.
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            docker image prune -f
