services:
  postgres:
    image: postgres:16-alpine
    container_name: code-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: code
      POSTGRES_PASSWORD: code
      POSTGRES_DB: code
    ports:
      - "5432:5432"
    volumes:
      - code_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: code-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - code_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: code-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    volumes:
      - code_backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: code-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  code_postgres_data:
  code_redis_data:
  code_backend_uploads:
